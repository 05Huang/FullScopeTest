# FullScopeTest production Docker Compose (OpenResty on host, services in Docker)

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD 环境变量} --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fullscopetest_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:6080:6080"
    environment:
      - FLASK_ENV=production
      - DISPLAY=:99
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_ENABLE=true
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
      - OSS_DOMAIN=${OSS_DOMAIN}
      - AI_ASSISTANT_ENABLED=${AI_ASSISTANT_ENABLED}
      - AI_ASSISTANT_BASE_URL=${AI_ASSISTANT_BASE_URL}
      - AI_ASSISTANT_MODEL=${AI_ASSISTANT_MODEL}
      - AI_ASSISTANT_API_KEY=${AI_ASSISTANT_API_KEY}
      - AI_VISION_BASE_URL=${AI_VISION_BASE_URL}
      - AI_VISION_MODEL=${AI_VISION_MODEL}
      - AI_VISION_API_KEY=${AI_VISION_API_KEY}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT:-15}
      - AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_URL=${AI_EXPLORE_LIVE_VIEW_RELEASE_URL:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT:-6}
      - AI_EXPLORE_BROWSER_HEADLESS=${AI_EXPLORE_BROWSER_HEADLESS:-false}
      - AI_EXPLORE_BROWSER_SLOW_MO=${AI_EXPLORE_BROWSER_SLOW_MO:-0}
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -lc "
      Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
      fluxbox >/tmp/fluxbox.log 2>&1 &&
      echo '${VNC_PASSWORD:-fullscopetest}' | x11vnc -display :99 -rfbport 5900 -forever -shared -stdin >/tmp/x11vnc.log 2>&1 &
      websockify --web=/usr/share/novnc/ 0.0.0.0:6080 localhost:5900 >/tmp/websockify.log 2>&1 &
      exec gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 wsgi:app
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullscopetest_network

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.extensions:celery inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_ENABLE=true
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
      - OSS_DOMAIN=${OSS_DOMAIN}
      - AI_ASSISTANT_ENABLED=${AI_ASSISTANT_ENABLED}
      - AI_ASSISTANT_BASE_URL=${AI_ASSISTANT_BASE_URL}
      - AI_ASSISTANT_MODEL=${AI_ASSISTANT_MODEL}
      - AI_ASSISTANT_API_KEY=${AI_ASSISTANT_API_KEY}
      - AI_VISION_BASE_URL=${AI_VISION_BASE_URL}
      - AI_VISION_MODEL=${AI_VISION_MODEL}
      - AI_VISION_API_KEY=${AI_VISION_API_KEY}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT:-15}
      - AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_URL=${AI_EXPLORE_LIVE_VIEW_RELEASE_URL:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT:-6}
      - AI_EXPLORE_BROWSER_HEADLESS=${AI_EXPLORE_BROWSER_HEADLESS:-true}
      - AI_EXPLORE_BROWSER_SLOW_MO=${AI_EXPLORE_BROWSER_SLOW_MO:-0}
    volumes:
      - backend_reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.extensions:celery worker --loglevel=warning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fullscopetest_network

  # Prometheus 监控（生产环境）
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fullscopetest_prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    networks:
      - fullscopetest_network

  # Grafana 可视化（生产环境）
  grafana:
    image: grafana/grafana:10.2.2
    container_name: fullscopetest_grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD 环境变量}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fullscopetest_network

  # AlertManager 告警管理（生产环境）
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: fullscopetest_alertmanager
    restart: always
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/monitoring/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    environment:
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL:-http://localhost:5001/webhook}
      - ALERTMANAGER_CRITICAL_WEBHOOK_URL=${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://localhost:5001/webhook/critical}
    depends_on:
      - prometheus
    networks:
      - fullscopetest_network

networks:
  fullscopetest_network:
    driver: bridge

volumes:
  redis_data:
  backend_uploads:
  backend_reports:
  prometheus_data:
  alertmanager_data:
  grafana_data:
