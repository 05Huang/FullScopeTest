# FullScopeTest 开发环境 Docker Compose
# 启动命令: docker-compose up -d

version: '3.8'

services:

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: fullscopetest_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fullscopetest}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD 环境变量}
      - POSTGRES_DB=${POSTGRES_DB:-fullscopetest_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullscopetest -d fullscopetest_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 缓存/消息队列
  redis:
    image: redis:7-alpine
    container_name: fullscopetest_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask 后端 (开发环境)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.dev
    container_name: fullscopetest_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fullscopetest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fullscopetest_dev}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT:-15}
      - AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_URL=${AI_EXPLORE_LIVE_VIEW_RELEASE_URL:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT:-6}
      - AI_EXPLORE_BROWSER_HEADLESS=${AI_EXPLORE_BROWSER_HEADLESS:-true}
      - AI_EXPLORE_BROWSER_SLOW_MO=${AI_EXPLORE_BROWSER_SLOW_MO:-0}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --reload

  # Celery Worker (异步任务)
  celery:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.dev
    container_name: fullscopetest_celery
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fullscopetest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fullscopetest_dev}
      - REDIS_URL=redis://redis:6379/0
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_URL:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TOKEN:-}
      - AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_ALLOCATOR_TIMEOUT:-15}
      - AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_INTERNAL_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE=${AI_EXPLORE_LIVE_VIEW_URL_TEMPLATE:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_URL=${AI_EXPLORE_LIVE_VIEW_RELEASE_URL:-}
      - AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT=${AI_EXPLORE_LIVE_VIEW_RELEASE_TIMEOUT:-6}
      - AI_EXPLORE_BROWSER_HEADLESS=${AI_EXPLORE_BROWSER_HEADLESS:-true}
      - AI_EXPLORE_BROWSER_SLOW_MO=${AI_EXPLORE_BROWSER_SLOW_MO:-0}
    volumes:
      - ./backend:/app
      - backend_reports:/app/reports
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks worker --loglevel=info

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fullscopetest_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

  # Grafana 可视化
  grafana:
    image: grafana/grafana:10.2.2
    container_name: fullscopetest_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_reports:
  prometheus_data:
  grafana_data:
