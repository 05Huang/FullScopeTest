# FullScopeTest AlertManager 配置
#
# 通知渠道配置：
#   - Webhook（通用，支持钉钉/飞书/企业微信）
#   - Slack（预留模板）
#   - Email（预留模板）
#
# 使用方式：
#   1. 设置对应环境变量
#   2. 将此文件挂载到 AlertManager 容器
#   3. 在 docker-compose.prod.yml 中添加 alertmanager 服务

global:
  resolve_timeout: 5m

# 通知模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  # 默认接收者
  receiver: 'default-webhook'
  # 分组策略
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # critical 级别告警立即通知
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # 默认 Webhook 通知（可对接钉钉/飞书/企业微信）
  - name: 'default-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:5001/webhook}'
        send_resolved: true
        http_config:
          # 如需 Bearer Token 认证，取消下面注释
          # authorization:
          #   type: Bearer
          #   credentials: '${WEBHOOK_TOKEN}'

  # Critical 级别 Webhook
  - name: 'critical-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://localhost:5001/webhook/critical}'
        send_resolved: true

  # Slack 通知（预留）
  # - name: 'slack'
  #   slack_configs:
  #     - api_url: '${SLACK_WEBHOOK_URL}'
  #       channel: '#alerts'
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Email 通知（预留）
  # - name: 'email'
  #   email_configs:
  #     - to: '${ALERT_EMAIL:-admin@example.com}'
  #       from: 'alertmanager@fullscopetest.local'
  #       smarthost: '${SMTP_HOST:-smtp.example.com:587}'
  #       auth_username: '${SMTP_USER}'
  #       auth_password: '${SMTP_PASSWORD}'

# 抑制规则：critical 告警抑制同名 warning 告警
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
