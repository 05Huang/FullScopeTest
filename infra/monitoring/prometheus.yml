# Prometheus 配置文件
# FullScopeTest 监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FullScopeTest 后端应用
  - job_name: "fullscopetest-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: "fullscopetest-backend"
          environment: "development"

  # Celery Worker（如果暴露了 metrics）
  # - job_name: "fullscopetest-celery"
  #   metrics_path: "/metrics"
  #   static_configs:
  #     - targets: ["celery:8001"]

  # Prometheus 自身监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
