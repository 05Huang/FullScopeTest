<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 12px; font-size: 14px; color: #1890ff; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 4px; }
    .btn-primary { background: #1890ff; color: white; }
    .btn-danger { background: #ff4d4f; color: white; }
    .btn-success { background: #52c41a; color: white; }
    .status { padding: 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
    .status-recording { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; }
    .status-idle { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
    .steps { max-height: 200px; overflow-y: auto; margin: 8px 0; }
    .step { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; font-size: 11px; }
    .step-type { display: inline-block; width: 50px; font-weight: bold; }
    textarea { width: 100%; height: 100px; font-size: 11px; font-family: monospace; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>FullScopeTest Recorder</h3>
  <div id="status" class="status status-idle">Ready</div>
  <div>
    <button id="startBtn" class="btn btn-primary">Start Recording</button>
    <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
    <button id="exportBtn" class="btn btn-success" disabled>Export Steps</button>
  </div>
  <div id="stepsContainer" class="steps"></div>
  <textarea id="output" placeholder="Exported steps will appear here" style="display:none"></textarea>
  <script src="popup.js"></script>
</body>
</html>
